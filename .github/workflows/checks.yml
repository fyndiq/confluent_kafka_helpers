name: Library checks

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      commit_base:
        default: ''
        type: string
      scan_base:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -fsSL --retry 3 "${base}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          curl -fsSL --retry 3 "${base}/gitleaks_${V}_checksums.txt" -o /tmp/checksums.txt
          expected="$(grep " gitleaks_${V}_linux_x64.tar.gz$" /tmp/checksums.txt | awk '{print $1}')"
          echo "${expected}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        env:
          BASE: ${{ inputs.scan_base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            gitleaks git --redact --exit-code 1 --log-opts="${BASE}..HEAD" .
          else
            gitleaks git --redact --exit-code 1 .
          fi

  test:
    name: test / checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: make setup
      - run: make unit-test
      - run: make lint

  library:
    name: commits / build / release preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Test release automation
        run: >-
          uv run --no-project --no-config --python 3.12
          --with commitizen==4.13.9 --with google-auth==2.40.3 --with requests==2.32.5
          python -m unittest discover -s scripts/library-ci -p 'test_*.py'
      - name: Validate commits, build distributions, and preview release
        env:
          COMMIT_BASE: ${{ inputs.commit_base }}
          RELEASE_PATHS: |
            confluent_kafka_helpers/*
            tests/*
            pyproject.toml
            setup.cfg
            README.md
        run: >-
          uv run --no-project --no-config --python 3.12 --with commitizen==4.13.9
          python scripts/library-ci/library_ci.py --working-directory .
          --base "$COMMIT_BASE" --head HEAD --release-paths "$RELEASE_PATHS"

  result:
    if: always()
    needs: [secret-scan, test, library]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success")' <<<"$RESULTS"
