name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      commit_base: ${{ github.event.pull_request.base.sha || '' }}
      scan_base: ${{ github.event.pull_request.base.sha || github.event.before }}

  result:
    name: CI result
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success")' <<<"$RESULTS"
