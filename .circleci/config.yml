version: 2.1
jobs:
  build:
    working_directory: ~/build
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run unit tests
          command: make unit-test
      - store_test_results:
          path: /tmp/test-results
      - run:
          name: Run lint
          command: make lint

workflows:
  build:
    jobs:
      - build
